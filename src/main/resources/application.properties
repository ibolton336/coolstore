# Datasource configuration - using H2 for verification without external dependencies
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb

# Production would use PostgreSQL - commented out for verification
#quarkus.datasource.db-kind=postgresql
#quarkus.datasource.username=postgresUser
#quarkus.datasource.password=postgresPW
#quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/postgresDB

# Hibernate configuration
quarkus.hibernate-orm.persistence-xml.ignore=true
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.format-sql=true
quarkus.hibernate-orm.jdbc.statement-fetch-size=10
quarkus.hibernate-orm.jdbc.statement-batch-size=10

# Flyway configuration
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# Reactive Messaging configuration - in-memory connector linking
# Outgoing channel -> incoming channel with broadcast (multiple consumers)
mp.messaging.outgoing.orders-out.connector=smallrye-in-memory
mp.messaging.incoming.orders.connector=smallrye-in-memory
mp.messaging.incoming.orders.broadcast=true
mp.messaging.incoming.orders.merge=true

# Application configuration
quarkus.http.port=8080
