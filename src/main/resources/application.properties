# Application
quarkus.application.name=coolstore-monolith
quarkus.application.version=1.0.0-SNAPSHOT

# DataSource - PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgresUser
quarkus.datasource.password=postgresPW
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/postgresDB
quarkus.datasource.jdbc.driver=org.postgresql.Driver

# Hibernate/JPA
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.dialect=org.hibernate.dialect.PostgreSQLDialect
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.bind-parameters=false

# Flyway (database migration)
quarkus.flyway.baseline-on-migrate=true

# REST/JSON
quarkus.http.port=8080
quarkus.rest-client.logging.scope=request-response

# Logging
quarkus.log.level=INFO
quarkus.log.file.path=./logs
quarkus.log.file.level=DEBUG

# SmallRye Reactive Messaging
# NOTE: For production, configure with actual broker connectors (Kafka, RabbitMQ, etc.)
# The in-memory connector is not available in standard Quarkus distributions.
# Using simple broker connector for testing instead.

# Use the default broker for messaging (requires configuration)
mp.messaging.broker.auto-create=true

# Security (placeholder for Keycloak integration if needed)
# quarkus.oidc.enabled=false
