# Datasource configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgresUser
quarkus.datasource.password=postgresPW
quarkus.datasource.jdbc.url=jdbc:postgresql://127.0.0.1:5432/postgresDB
quarkus.datasource.jdbc.max-size=16

# Hibernate ORM configuration
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.format-sql=true
quarkus.hibernate-orm.log.bind-parameters=true
quarkus.hibernate-orm.jdbc.statement-batch-size=0

# Flyway configuration
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=classpath:db/migration

# HTTP configuration
quarkus.http.port=8080
quarkus.http.root-path=/

# OIDC/Keycloak configuration
quarkus.oidc.auth-server-url=http://127.0.0.1:8081/realms/eap
quarkus.oidc.client-id=coolstore-app
quarkus.oidc.credentials.secret=secret
quarkus.oidc.application-type=web-app
quarkus.oidc.tls.verification=none

# Security configuration
quarkus.security.users.embedded.enabled=false

# JMS/Artemis configuration for messaging
quarkus.artemis.url=tcp://localhost:61616
quarkus.artemis.username=admin
quarkus.artemis.password=admin

# Health check
quarkus.health.extensions.enabled=true

# Application configuration
quarkus.application.name=coolstore-monolith

# Logging
quarkus.log.console.enable=true
quarkus.log.console.level=INFO
quarkus.log.category."com.redhat.coolstore".level=DEBUG

# Static resources
quarkus.http.enable-compression=true
quarkus.http.static-resources.index-page=index.jsp

# Reactive Messaging configuration for orders topic
mp.messaging.outgoing.orders.connector=smallrye-jms
mp.messaging.outgoing.orders.destination=orders
mp.messaging.outgoing.orders.destination-type=topic

mp.messaging.incoming.orders.connector=smallrye-jms
mp.messaging.incoming.orders.destination=orders
mp.messaging.incoming.orders.destination-type=topic
