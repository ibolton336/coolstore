# Datasource configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${COOLSTORE_DB_URL:jdbc:postgresql://localhost:5432/coolstore}
quarkus.datasource.username=${COOLSTORE_DB_USER:coolstore}
quarkus.datasource.password=${COOLSTORE_DB_PASSWORD:coolstore}

# Hibernate ORM configuration
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.format-sql=true
quarkus.hibernate-orm.show-sql=false

# Flyway database migration
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# SmallRye Reactive Messaging - orders topic
mp.messaging.incoming.orders.connector=smallrye-in-memory
mp.messaging.incoming.orders.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

mp.messaging.outgoing.orders.connector=smallrye-in-memory

# HTTP configuration
quarkus.http.port=8080
quarkus.http.cors=true