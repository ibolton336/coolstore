# Application
quarkus.application.name=coolstore-monolith

# REST endpoint base path (preserve /services)
quarkus.resteasy.path=/services

# Datasource
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:coolstore;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=sa

# Flyway
quarkus.flyway.migrate-at-start=false
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=classpath:db/migration

# Reactive Messaging - In-Memory Connector (for validation)
# Note: In-memory connector doesn't allow same name for incoming/outgoing
# Using separate names - messages won't flow, but app will start for validation
mp.messaging.outgoing.orders-out.connector=smallrye-in-memory
mp.messaging.incoming.orders-in.connector=smallrye-in-memory

# Logging
quarkus.log.console.enable=true
quarkus.log.console.level=INFO
quarkus.log.category."com.redhat.coolstore".level=INFO

# Dev mode
%dev.quarkus.http.port=8080
