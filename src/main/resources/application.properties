# Datasource configuration (using H2 in-memory for testing)
quarkus.datasource.db-kind=h2
quarkus.datasource.username=coolstore
quarkus.datasource.password=coolstore
quarkus.datasource.jdbc.url=jdbc:h2:mem:coolstore;DB_CLOSE_DELAY=-1

# Hibernate ORM configuration
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.dialect=org.hibernate.dialect.H2Dialect
quarkus.hibernate-orm.persistence-xml.ignore=true

# Flyway configuration
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=classpath:db/migration

# JAX-RS base path (preserve /services for API compatibility)
quarkus.resteasy-reactive.path=/services

# Reactive Messaging configuration (JMS topic replacement)
# With in-memory connector, use the same topic name for broadcast
# Producer sends to "orders" channel
mp.messaging.outgoing.orders.connector=smallrye-in-memory
mp.messaging.outgoing.orders.topic=orders

# Consumer 1: OrderServiceMDB receives from "orders" topic
mp.messaging.incoming.orders-processor.connector=smallrye-in-memory
mp.messaging.incoming.orders-processor.topic=orders
mp.messaging.incoming.orders-processor.broadcast=true

# Consumer 2: InventoryNotificationMDB receives from "orders" topic  
mp.messaging.incoming.orders-inventory.connector=smallrye-in-memory
mp.messaging.incoming.orders-inventory.topic=orders
mp.messaging.incoming.orders-inventory.broadcast=true

# Audit log configuration
audit.log.directory=${AUDIT_LOG_DIR:./device-inventory-audit-logs}
