# Datasource configuration (replaces JNDI lookup)
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:mem:coolstore;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

# Hibernate/JPA configuration
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.sql-load-script=no-file

# Flyway configuration
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=classpath:db/migration

# JAX-RS path preservation
quarkus.resteasy.path=/services

# Reactive Messaging - In-memory connector (implicit via @Channel and @Incoming)
# No explicit configuration needed - in-memory connector auto-discovered

# Session management for @SessionScoped beans
quarkus.servlet.context-path=/
quarkus.http.enable-compression=false
