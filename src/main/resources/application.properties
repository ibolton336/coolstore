# Quarkus Configuration

# HTTP Configuration
quarkus.http.port=8080
quarkus.http.root-path=/

# Application name
quarkus.application.name=coolstore-monolith

# REST Configuration
quarkus.resteasy-reactive.path=/services

# DataSource Configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgresUser
quarkus.datasource.password=postgresPW
quarkus.datasource.jdbc.url=jdbc:postgresql://127.0.0.1:5432/postgresDB
quarkus.datasource.jdbc.max-size=16

# Hibernate Configuration
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.format-sql=true
quarkus.hibernate-orm.log.jdbc-warnings=true

# Flyway Configuration
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=1.0
quarkus.flyway.locations=classpath:db/migration

# Artemis JMS Configuration
quarkus.artemis.url=tcp://localhost:61616
quarkus.artemis.username=admin
quarkus.artemis.password=admin

# Reactive Messaging - In-memory connector for orders topic (for now)
mp.messaging.outgoing.orders.connector=smallrye-in-memory
mp.messaging.incoming.orders.connector=smallrye-in-memory
mp.messaging.incoming.orders-notification.connector=smallrye-in-memory

# OIDC/Keycloak Configuration (disabled for now)
quarkus.oidc.enabled=false
#quarkus.oidc.auth-server-url=http://127.0.0.1:8081/realms/eap
#quarkus.oidc.client-id=jboss-app
#quarkus.oidc.credentials.secret=secret
#quarkus.oidc.application-type=web-app
#quarkus.http.auth.permission.authenticated.paths=/*
#quarkus.http.auth.permission.authenticated.policy=authenticated
#quarkus.http.auth.permission.public.paths=/services/*,/index.jsp,/health.jsp,/coolstore.json,/app/*,/bower_components/*,/partials/*
#quarkus.http.auth.permission.public.policy=permit

# Logging Configuration
quarkus.log.console.enable=true
quarkus.log.console.level=INFO
quarkus.log.category."com.redhat.coolstore".level=INFO

# Context propagation for async operations
quarkus.smallrye-context-propagation.enable=true

# Package type
quarkus.package.type=uber-jar
