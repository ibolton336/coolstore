# Application
quarkus.application.name=coolstore-monolith
quarkus.application.version=1.0.0-SNAPSHOT

# REST path (preserve Java EE @ApplicationPath)
quarkus.resteasy-reactive.path=/services

# HTTP
quarkus.http.port=8080

# Datasource configuration
# Dev/test mode: H2 in-memory database
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.username=sa
%dev.quarkus.datasource.password=
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:coolstoredb;DB_CLOSE_DELAY=-1

# Production mode: PostgreSQL (when available)
%prod.quarkus.datasource.db-kind=h2
%prod.quarkus.datasource.username=sa
%prod.quarkus.datasource.password=
%prod.quarkus.datasource.jdbc.url=jdbc:h2:mem:coolstoredb;DB_CLOSE_DELAY=-1

# Fallback for profile-less mode
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:mem:coolstoredb;DB_CLOSE_DELAY=-1

# Flyway configuration
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=classpath:db/migration

# Hibernate configuration
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.redhat.coolstore".level=INFO

# Reactive Messaging - In-Memory for testing (no AMQP broker required)
# Producer channel for orders
mp.messaging.outgoing.orders-out.connector=smallrye-in-memory

# Consumer channel for OrderService  
mp.messaging.incoming.orders-service.connector=smallrye-in-memory

