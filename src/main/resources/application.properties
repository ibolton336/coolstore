# Datasource (using H2 in-memory for verification)
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:coolstore;DB_CLOSE_DELAY=-1

# Hibernate
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.format-sql=true

# Flyway (disabled for H2 in-memory, using Hibernate drop-and-create)
quarkus.flyway.migrate-at-start=false

# Production datasource (PostgreSQL - requires external database)
%prod-postgres.quarkus.datasource.db-kind=postgresql
%prod-postgres.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/coolstore
%prod-postgres.quarkus.datasource.username=coolstore
%prod-postgres.quarkus.datasource.password=coolstore
%prod-postgres.quarkus.hibernate-orm.database.generation=none
%prod-postgres.quarkus.flyway.migrate-at-start=true
%prod-postgres.quarkus.flyway.locations=classpath:db/migration

# Dev mode datasource (H2 in-memory)
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:coolstore;DB_CLOSE_DELAY=-1
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%dev.quarkus.flyway.migrate-at-start=false

# Test datasource
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.flyway.migrate-at-start=false

# AMQP broker connection
amqp-host=localhost
amqp-port=5672
amqp-username=admin
amqp-password=admin

# Outgoing channel (producer)
mp.messaging.outgoing.orders-out.connector=smallrye-amqp
mp.messaging.outgoing.orders-out.address=orders

# Incoming channel 1 (OrderServiceMDB)
mp.messaging.incoming.orders-in-order-service.connector=smallrye-amqp
mp.messaging.incoming.orders-in-order-service.address=orders
mp.messaging.incoming.orders-in-order-service.durable=true

# Incoming channel 2 (InventoryNotificationMDB)
mp.messaging.incoming.orders-in-inventory.connector=smallrye-amqp
mp.messaging.incoming.orders-in-inventory.address=orders
mp.messaging.incoming.orders-in-inventory.durable=true
